# =============================================================================
# configs/arm64_flavors.conf
#
# Maps each arm64 PLATFORM (field 2 of hardware_map.conf) to the
# hexdump0815 kernel flavor it is built from. The workflow reads this
# instead of guessing from the platform name.
#
#   PLATFORM      platform value used in hardware_map.conf
#   FLAVOR        hexdump0815 flavor: misc.<FLAVOR>/ and readme.<FLAVOR> in the tree
#   REPO_KEY      tree to clone: ARM64_EXTERNAL_REPO_URL_<REPO_KEY> in kernel_versions.conf
#   KCO_PLATFORM  extra kernel-config-options fragment merged after
#                 chromebooks-aarch64.cfg (e.g. mediatek -> mediatek.cfg), or "none"
#   TREE_PATCHES  patches from the tree, as listed in readme.<FLAVOR>:
#                   soc-glob  misc.<FLAVOR>/patches/v<series>/<soc>*.patch (cbm layout)
#                   none      no patches from the tree
#                   a,b,...   these files from misc.<FLAVOR>/patches/, in order
#
# Copy KCO_PLATFORM and TREE_PATCHES from hexdump0815's readme.<FLAVOR>
# on the lts branch in use, and recheck them when bumping the series.
# =============================================================================

# PLATFORM|FLAVOR|REPO_KEY|KCO_PLATFORM|TREE_PATCHES
mediatek-mt81xx|cbm|MEDIATEK|mediatek|soc-glob
rockchip-gru|cbg|GENERIC|none|none
qcom-trogdor|cbq|GENERIC|mediatek|add-gamma-lut-support.patch
